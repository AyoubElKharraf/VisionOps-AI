name: VisionOps CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-lint-test:
    name: Engine — lint & unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: visionops-engine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            visionops-engine/requirements.txt
            visionops-engine/requirements-dev.txt

      - name: Install deps (lightweight for geometry/NMS tests)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install numpy opencv-python-headless shapely pydantic onnxruntime ultralytics lap prometheus-client

      - name: Ruff lint
        run: >
          ruff check main.py demo_roi.py byte_tracker.py roi_manager.py
          onnx_engine.py export_onnx.py alert_client.py stream_capture.py
          metrics_server.py multi_cam_runner.py presence_heatmap.py tests

      - name: Pytest
        run: pytest -q tests

  backend-lint-test:
    name: Backend — lint & API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: visionops-backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: visionops
          POSTGRES_PASSWORD: visionops_secret
          POSTGRES_DB: visionops_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U visionops -d visionops_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://visionops:visionops_secret@localhost:5432/visionops_db
      MINIO_ENDPOINT: localhost:9001
      MINIO_ROOT_USER: visionops_minio
      MINIO_ROOT_PASSWORD: visionops_minio_secret
      MINIO_BUCKET: visionops-media-ci
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            visionops-backend/requirements.txt
            visionops-backend/requirements-dev.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check app tests

      - name: Pytest API
        run: pytest -q tests

  ui-lint:
    name: UI — typecheck build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: visionops-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: visionops-ui/package-lock.json
      - run: npm ci
      - run: npm run test:unit
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8001
          NEXT_PUBLIC_WS_URL: ws://127.0.0.1:8001/api/v1/ws/detections

  e2e:
    name: E2E — Playwright
    runs-on: ubuntu-latest
    needs: [backend-lint-test, ui-lint]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: visionops-ui/package-lock.json

      - name: Install UI and Chromium
        working-directory: visionops-ui
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Start E2E stack
        run: docker compose up -d --build backend ui

      - name: Wait for API and UI
        run: |
          timeout 180 bash -c 'until curl -fsS http://127.0.0.1:8001/health; do sleep 3; done'
          timeout 180 bash -c 'until curl -fsS http://127.0.0.1:3000/login; do sleep 3; done'

      - name: Run Playwright
        working-directory: visionops-ui
        run: npm run test:e2e
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          PLAYWRIGHT_API_URL: http://127.0.0.1:8001
          VISIONOPS_API_KEY: visionops-dev-key
          VISIONOPS_ADMIN_USERNAME: admin
          VISIONOPS_ADMIN_PASSWORD: visionops-admin

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: visionops-ui/playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200 backend ui postgres minio

      - name: Stop E2E stack
        if: always()
        run: docker compose down -v
