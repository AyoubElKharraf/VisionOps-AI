global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: visionops-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8001"]
        labels:
          service: backend

  - job_name: visionops-engine
    metrics_path: /metrics
    static_configs:
      - targets: ["engine:9101"]
        labels:
          service: engine
