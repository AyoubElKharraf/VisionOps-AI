# MediaMTX — local demo config (no auth)
logLevel: info
logDestinations: [stdout]

rtsp: yes
rtspAddress: :8554
rtmp: yes
rtmpAddress: :1935
webrtc: yes
webrtcAddress: :8889
hls: yes
hlsAddress: :8888
api: yes
apiAddress: :9997

# Allow publishing/reading without credentials for Phase 1
paths:
  all_others:
    # Accept any path for RTSP publish / read
    source: publisher
